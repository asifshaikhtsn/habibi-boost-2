name: Boost-2 ProxRipper THIRD 50k

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/boost.yml"
      - "boost_aggregator.py"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boost-v2
  cancel-in-progress: true

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install aiohttp
      - name: Fetch proxy v2 engine
        run: |
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_country.py -o geo_country.py
          curl -fsSL https://raw.githubusercontent.com/asifshaikhtsn/Walla/main/geo_runner.py -o geo_runner.py
      - name: Run boost v2
        run: python geo_runner.py boost_aggregator.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f geo_country.py geo_runner.py
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Boost v2: update proxy lists [skip ci]"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for i in {1..3}; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin HEAD && exit 0
            sleep 10
          done
          exit 1
