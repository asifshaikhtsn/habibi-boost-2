name: Boost-2 ProxRipper THIRD 50k

on:
  schedule:
    - cron: "0 * * * *"  # Every 1 hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boost
  cancel-in-progress: true

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install aiohttp

      - name: Run booster
        run: python boost_aggregator.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Boost: update proxy lists [skip ci]"
          # Pull with rebase on current branch (handles both master/main)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull --rebase --autostash origin $BRANCH || git pull --rebase --autostash || true
          git push origin HEAD
